[project]
name = "PiiFilterPoc"
version = "0.1.0"
description = "Excel PII filter PoC with Bedrock Guardrails on AgentCore Runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "aws-opentelemetry-distro ~= 0.21.0",
    "boto3",
    "openpyxl",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]",
    "types-openpyxl",
    "mypy",
]

[tool.uv]
package = false
